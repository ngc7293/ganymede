[package]
name = "ganymede"
version = "3.0.0"
authors = ["David Bourgault <contact@davidbourgault.ca"]
edition = "2021"

[dependencies]
chrono = "0.4.38"
chrono-tz = "0.9.0"
clap = { version = "4.5.17", features = ["derive"] }
env_logger = "0.11.5"
futures-core = "0.3.30"
jsonwebtoken = { version = "9.3.0", features = ["use_pem"] }
log = "0.4.22"
prost = "0.13.2"
prost-types = "0.13.2"
serde = "1.0.209"
serde_json = "1.0.128"
sqlx = { version = "0.8.2", features = ["postgres", "uuid", "json", "chrono", "runtime-tokio-rustls"] }
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread"] }
toml = "0.8.19"
tonic = "0.12.2"
tonic-health = "0.12.2"
tonic-reflection = "0.12.2"
uuid = { version = "1.10.0", features = ["v4"] }

[[bin]]
name = "ganymede"
path = "src/main.rs"

[build-dependencies]
tonic-build = "0.12.2"
